<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suki - 粒子動畫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.6;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hint">點擊畫面重新播放</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 設定畫布大小
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== 粒子系統 ==========

class Particle {
    constructor(targetX, targetY, index, total) {
        // 起始位置：隨機散佈在畫面外圍
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.max(canvas.width, canvas.height) * 0.6 + Math.random() * 300;
        this.x = canvas.width / 2 + Math.cos(angle) * distance;
        this.y = canvas.height / 2 + Math.sin(angle) * distance;
        
        // 目標位置（組成 "Suki" 的點）
        this.targetX = targetX;
        this.targetY = targetY;
        
        // 動畫參數
        this.delay = (index / total) * 1200 + Math.random() * 400; // 錯開到達時間
        this.duration = 1500 + Math.random() * 1000; // 飛行時間 1.5-2.5 秒
        this.startTime = null;
        
        // 外觀
        this.size = 2 + Math.random() * 3;
        this.baseColor = this.generateColor(index, total);
        this.glowSize = 8 + Math.random() * 12;
        
        // 到達後的微動動畫
        this.floatOffset = Math.random() * Math.PI * 2;
        this.floatSpeed = 0.02 + Math.random() * 0.02;
        this.floatAmp = 2 + Math.random() * 3;
        
        this.arrived = false;
        this.arrivalTime = 0;
    }
    
    generateColor(index, total) {
        // 漸層色：從粉紅到紫色到藍色
        const hue = 320 + (index / total) * 80; // 320-400 (pink -> purple -> blue)
        const saturation = 70 + Math.random() * 30;
        const lightness = 50 + Math.random() * 20;
        return { h: hue % 360, s: saturation, l: lightness };
    }
    
    // Easing 函數：ease-out-cubic（先快後慢，有流暢感）
    easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
    }
    
    // Ease-out-back：到達時有輕微回彈
    easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    
    update(currentTime) {
        if (!this.startTime) this.startTime = currentTime;
        
        const elapsed = currentTime - this.startTime - this.delay;
        
        if (elapsed < 0) {
            // 還沒開始飛行，停留在起始位置
            return;
        }
        
        const progress = Math.min(elapsed / this.duration, 1);
        
        if (progress >= 1) {
            // 已到達目標
            this.arrived = true;
            this.arrivalTime = currentTime;
            
            // 到達後輕微漂浮
            const floatY = Math.sin(currentTime * this.floatSpeed + this.floatOffset) * this.floatAmp;
            this.x = this.targetX;
            this.y = this.targetY + floatY;
        } else {
            // 飛行中
            const eased = this.easeOutBack(progress);
            this.x = this.x + (this.targetX - this.x) * 0.08; // 平滑追蹤
            this.y = this.y + (this.targetY - this.y) * 0.08;
            
            // 同時用 easing 校正
            const directEase = this.easeOutCubic(progress);
            this.x = this.targetX * directEase + this.x * (1 - directEase);
            this.y = this.targetY * directEase + this.y * (1 - directEase);
        }
    }
    
    draw(ctx, currentTime) {
        const elapsed = currentTime - this.startTime - this.delay;
        if (elapsed < -100) return; // 還沒出現
        
        const c = this.baseColor;
        
        // 到達後閃爍效果
        let alpha = 1;
        let glowAlpha = 0.3;
        
        if (this.arrived) {
            const sinceArrival = currentTime - this.arrivalTime;
            const pulse = Math.sin(sinceArrival * 0.003 + this.floatOffset) * 0.3 + 0.7;
            alpha = pulse;
            glowAlpha = pulse * 0.4;
        } else if (elapsed < 0) {
            // 即將出現，淡入
            alpha = Math.max(0, 1 + elapsed / 100);
        }
        
        // 繪製光暈
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.glowSize);
        gradient.addColorStop(0, `hsla(${c.h}, ${c.s}%, ${c.l}%, ${glowAlpha})`);
        gradient.addColorStop(0.5, `hsla(${c.h}, ${c.s}%, ${c.l}%, ${glowAlpha * 0.3})`);
        gradient.addColorStop(1, `hsla(${c.h}, ${c.s}%, ${c.l}%, 0)`);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.glowSize, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // 繪製核心粒子
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${c.h}, ${c.s}%, ${Math.min(c.l + 20, 90)}%, ${alpha})`;
        ctx.fill();
    }
}

// ========== 生成 "Suki" 字形點陣 ==========

function generateTextPoints(text, fontSize, spacing) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    
    // 設定字體
    tempCtx.font = `bold ${fontSize}px "Segoe UI", "Helvetica Neue", sans-serif`;
    const metrics = tempCtx.measureText(text);
    const width = metrics.width + 40;
    const height = fontSize * 1.5;
    
    tempCanvas.width = width;
    tempCanvas.height = height;
    tempCtx.font = `bold ${fontSize}px "Segoe UI", "Helvetica Neue", sans-serif`;
    tempCtx.fillStyle = 'white';
    tempCtx.textAlign = 'center';
    tempCtx.textBaseline = 'middle';
    tempCtx.fillText(text, width / 2, height / 2);
    
    // 採樣像素點
    const imageData = tempCtx.getImageData(0, 0, width, height);
    const points = [];
    
    for (let y = 0; y < height; y += spacing) {
        for (let x = 0; x < width; x += spacing) {
            const i = (y * width + x) * 4;
            if (imageData.data[i + 3] > 128) { // alpha > 128
                points.push({
                    x: x - width / 2,
                    y: y - height / 2
                });
            }
        }
    }
    
    return { points, width, height };
}

// ========== 主程式 ==========

let particles = [];
let animationStart = null;
let isRunning = false;

function initAnimation() {
    // 生成 "Suki" 字形點陣
    const fontSize = Math.min(canvas.width, canvas.height) * 0.25;
    const spacing = 4; // 點之間的間距（越小粒子越多）
    const textData = generateTextPoints('Suki', fontSize, spacing);
    
    // 建立粒子
    particles = [];
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    textData.points.forEach((pt, i) => {
        particles.push(new Particle(
            centerX + pt.x,
            centerY + pt.y,
            i,
            textData.points.length
        ));
    });
    
    animationStart = performance.now();
    isRunning = true;
}

function animate(currentTime) {
    if (!isRunning) return;
    
    // 清除畫布（帶殘影效果）
    ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 更新並繪製所有粒子
    particles.forEach(p => {
        p.update(currentTime);
        p.draw(ctx, currentTime);
    });
    
    // 繪製連接線（到達後粒子間的微弱連線，增加質感）
    drawConnections(currentTime);
    
    requestAnimationFrame(animate);
}

function drawConnections(currentTime) {
    const arrivedParticles = particles.filter(p => p.arrived);
    if (arrivedParticles.length < 2) return;
    
    ctx.strokeStyle = 'rgba(200, 100, 200, 0.03)';
    ctx.lineWidth = 0.5;
    
    // 只連接距離近的粒子，避免過度繪製
    for (let i = 0; i < arrivedParticles.length; i += 3) {
        const p1 = arrivedParticles[i];
        for (let j = i + 1; j < arrivedParticles.length; j += 5) {
            const p2 = arrivedParticles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 30) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
    }
}

// 啟動
canvas.addEventListener('click', () => {
    initAnimation();
});

// 自動啟動
initAnimation();
requestAnimationFrame(animate);

// 鍵盤快捷鍵
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        initAnimation();
    }
});
</script>
</body>
</html>
